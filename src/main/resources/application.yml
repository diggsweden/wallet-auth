server:
  port: 9000
spring:
  application:
    name: wallet-authorization-server

wallet:
  authorization-server:
    # EC P-256 private JWK (JSON) used to sign access tokens.
    # When empty, an ephemeral key is generated at startup (dev/test only).
    signing-key: ${SIGNING_KEY:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
