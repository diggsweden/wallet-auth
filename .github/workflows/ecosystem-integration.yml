name: Ecosystem Integration Test
# Disabled until wallet-ecosystem includes this service: manual trigger only.
# To enable, add back: pull_request with branches "**".
on: # yamllint disable-line rule:truthy
  workflow_dispatch:
permissions:
  contents: read
  packages: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  integration-test:
    uses: diggsweden/wallet-ecosystem/.github/workflows/reusable-integration.yml@11643ac9f13cd16504d7e5c1ab7b949051cb0e95 # main
    with:
      service-name: wallet-authorization-server
      service-repo: ${{ github.repository }}
      service-ref: ${{ github.event.pull_request.head.sha || github.ref }}
