# Artifacts Configuration
#
# Documentation: https://github.com/diggsweden/reusable-ci/blob/v2/docs/artifacts-reference.md

artifacts:
  - name: wallet-auth
    project-type: maven
    working-directory: .
    build-type: application
    config:
      java-version: 25
    sboms: all
    publish-to:
      - github-packages

containers:
  - name: wallet-auth
    from: [wallet-auth]
    container-file: Containerfile
    context: .
    platforms: linux/amd64,linux/arm64
    enable-slsa: true
    enable-scan: true
